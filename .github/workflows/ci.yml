# Continuous Integration Workflow
# Consolidated workflow combining build, test, and code quality checks
# Runs on all branches and pull requests to ensure code quality

name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/*.md'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/*.md'

# Permissions for security and test annotations
permissions:
  contents: read
  checks: write
  pull-requests: write

# Cancel in-progress runs when new push occurs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lint check - fails quickly on syntax/style errors
  quick-lint:
    name: Quick Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npx biome check ./src

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Summary
        if: always()
        run: |
          echo "## ⚡ Quick Lint Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Biome lint: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ✅" >> $GITHUB_STEP_SUMMARY

  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Test on Node.js versions for compatibility
    strategy:
      matrix:
        node-version: ['22.x', '25.x']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run tests with JUnit output for annotations
      - name: Run tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
        env:
          VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.VITE_GOOGLE_FONTS_API_KEY }}

      # Run lint and build
      - name: Run lint and build
        run: npm run lint && npm run build
        env:
          VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.VITE_GOOGLE_FONTS_API_KEY }}

      # Test annotations - show failures inline in PR
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always() && matrix.node-version == '22.x'
        with:
          name: Unit Tests
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false

      # Upload coverage reports
      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Add summary to GitHub Actions UI
      - name: Summary
        if: always()
        run: |
          echo "## ✅ Validation Complete (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript compilation: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Code linting: ✅" >> $GITHUB_STEP_SUMMARY

  # E2E tests run separately with Playwright
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run E2E on main branch or PRs targeting main to save CI time
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITE_GOOGLE_FONTS_API_KEY: ${{ secrets.VITE_GOOGLE_FONTS_API_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # E2E test annotations - show failures inline in PR
      - name: E2E Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: E2E Tests
          path: test-results/e2e-junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Summary
        if: always()
        run: |
          echo "## 🎭 E2E Tests Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Browser: Chromium" >> $GITHUB_STEP_SUMMARY
          echo "- Browser cache: ${{ steps.playwright-cache.outputs.cache-hit == 'true' && '✅ Hit' || '❌ Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✅" >> $GITHUB_STEP_SUMMARY
